services:
  migrate:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    command: alembic upgrade head
    restart: "no"

  redis:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q io -c 2 --hostname=worker@%h
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  beat:
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
