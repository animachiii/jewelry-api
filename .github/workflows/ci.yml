name: CI

on:
  push:
    branches: [main]
    # Phase 12: tag pushes also run CI, not just main — deploy.yml's
    # deploy-production job gates on this workflow's success via
    # workflow_run, and workflow_run only fires for events this workflow
    # itself listens to.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jewelry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jewelry_ci
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check app/ tests/ migrations/ scripts/

      - name: ruff format --check
        run: uv run ruff format --check app/ tests/ migrations/ scripts/

      - name: mypy --strict
        run: uv run mypy --strict app/

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: docker build
        run: docker build -t jewelry-api:ci .
